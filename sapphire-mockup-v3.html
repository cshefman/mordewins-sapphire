<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mordewin's Sapphire — design mockup v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#070b12; --bg1:#0c1422; --bg2:#101d31;
    --sap:#2f6fd6; --sap-bright:#5b9bff; --sap-deep:#13327a; --sap-glow:#3f86f0;
    --ice:#cfe6ff;
    --gold:#e9bd4c; --gold-bright:#f7da86; --gold-deep:#a9781d;
    --ink:#e9f1fc; --mut:#93a8c4; --mut2:#6c819e;
    --lock:#33415a; --lock-ink:#5e739a;
    --line:rgba(120,160,210,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Spectral',Georgia,serif;
    background:
      radial-gradient(1200px 800px at 50% -10%, #16263f 0%, rgba(22,38,63,0) 60%),
      radial-gradient(900px 700px at 80% 110%, #0e2034 0%, rgba(14,32,52,0) 55%),
      linear-gradient(160deg,#070b12 0%,#0a1320 55%,#070b12 100%);
    color:var(--ink); min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px 14px; overflow-x:hidden;
  }
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .cloud{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen}
  .c1{width:60vw;height:36vw;left:-10vw;top:8%;background:#1b3a63;animation:drift1 26s ease-in-out infinite}
  .c2{width:50vw;height:34vw;right:-8vw;top:30%;background:#16314f;animation:drift2 32s ease-in-out infinite}
  .c3{width:46vw;height:30vw;left:25vw;bottom:-6%;background:#142a47;animation:drift1 38s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(5vw,-3vh,0)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-6vw,4vh,0)}}
  .ambient{position:fixed;inset:0;background:radial-gradient(700px 500px at 50% 30%,rgba(150,200,255,.5),rgba(150,200,255,0) 70%);opacity:0;pointer-events:none;z-index:1;animation:amb 11s linear infinite}
  @keyframes amb{0%,93%,100%{opacity:0}94.4%{opacity:.5}95%{opacity:.05}95.4%{opacity:.38}96%{opacity:0}}

  .device{position:relative;z-index:2;width:412px;max-width:100%;
    background:linear-gradient(180deg,#0b1422,#080e18);
    border:1px solid rgba(120,160,210,.18);border-radius:34px;padding:14px 14px 20px;
    box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4) inset,0 0 60px rgba(47,111,214,.12);}
  .notch{width:120px;height:6px;border-radius:6px;background:#1c2942;margin:2px auto 16px}

  .hdr{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
  .who h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:19px;margin:0;letter-spacing:.5px;
    background:linear-gradient(180deg,#fbe6b4,#e9bd4c 55%,#a9781d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .who p{margin:2px 0 0;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
  .aurum{display:flex;align-items:center;gap:6px;font-family:'Cinzel',serif;font-size:16px;color:var(--gold-bright)}
  .aurum .pip{width:13px;height:13px;transform:rotate(45deg);background:linear-gradient(135deg,#f7da86,#a9781d);border-radius:2px;box-shadow:0 0 8px rgba(233,189,76,.6)}
  .aurum small{font-size:9.5px;letter-spacing:1.2px;color:var(--mut2);text-transform:uppercase;font-family:'Spectral'}

  .stage{position:relative;height:360px;margin:8px 0 4px;display:flex;align-items:center;justify-content:center}
  .wires,.fx{position:absolute;inset:0;pointer-events:none}
  .wires{z-index:1}.fx{z-index:3}
  .sapphire{position:relative;width:156px;height:156px;cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 0 24px rgba(63,134,240,.55));animation:breathe 5.5s ease-in-out infinite}
  .gemArt{width:156px;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  @keyframes charge{0%{filter:drop-shadow(0 0 24px rgba(63,134,240,.55))}28%{filter:drop-shadow(0 0 60px rgba(170,215,255,1)) brightness(1.65)}100%{filter:drop-shadow(0 0 24px rgba(63,134,240,.55))}}
  @keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-4px,2px)}30%{transform:translate(4px,-3px)}45%{transform:translate(-3px,-2px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,1px)}}
  .sapphire.fire{animation:shake .45s ease,charge .65s ease}

  .node{position:absolute;width:84px;text-align:center;cursor:pointer;transition:transform .15s ease;z-index:4}
  .node:active{transform:scale(.95)}
  .node .disc{width:54px;height:54px;margin:0 auto 5px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 32%,#12325f,#0b1c38 70%);border:1.5px solid var(--gold);
    box-shadow:0 0 16px rgba(233,189,76,.28),0 0 0 4px rgba(10,18,30,.6)}
  .node .disc i{font-size:24px;color:var(--gold-bright);filter:drop-shadow(0 0 6px rgba(233,189,76,.5))}
  .node.passive .disc{border-color:rgba(91,155,255,.5);box-shadow:0 0 14px rgba(47,111,214,.25),0 0 0 4px rgba(10,18,30,.6)}
  .node.passive .disc i{color:var(--sap-bright);filter:drop-shadow(0 0 5px rgba(91,155,255,.5))}
  .node.locked{cursor:default}
  .node.locked .disc{border-color:var(--lock);background:#0c1422;box-shadow:none}
  .node.locked .disc i{color:var(--lock-ink);filter:none}
  .node .nm{font-family:'Cinzel';font-size:10px;letter-spacing:.4px;color:var(--ink);line-height:1.2;text-shadow:0 1px 4px #000}
  .node.locked .nm{color:var(--lock-ink)}
  .pips{display:flex;gap:3px;justify-content:center;margin-top:4px}
  .pip2{width:7px;height:7px;transform:rotate(45deg);border-radius:1px;background:#16233b;border:1px solid rgba(120,160,210,.3)}
  .pip2.on{background:linear-gradient(135deg,#f7da86,#c9971f);border-color:#f7da86;box-shadow:0 0 6px rgba(233,189,76,.7)}
  .pip2.passive.on{background:linear-gradient(135deg,#8fc0ff,#2f6fd6);border-color:#8fc0ff;box-shadow:0 0 6px rgba(91,155,255,.6)}

  .rail{display:flex;gap:7px;margin:4px 4px 0}
  .chip{flex:1;background:#0e1828;border:1px solid rgba(120,160,210,.16);border-radius:12px;padding:8px 8px 7px;text-align:center}
  .chip .ct{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-family:'Cinzel'}
  .chip .cv{font-family:'Cinzel';font-size:15px;color:var(--sap-bright);margin-top:2px}
  .chip.lock .cv{color:var(--lock-ink)}

  .hint{text-align:center;font-size:10.5px;color:var(--mut2);margin:16px 4px 0;letter-spacing:.3px;font-style:italic}

  .scrim{position:absolute;inset:0;background:rgba(4,8,14,.55);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:.25s;z-index:7;border-radius:34px}
  .scrim.show{opacity:1;visibility:visible}
  .drawer{position:absolute;left:8px;right:8px;bottom:8px;z-index:8;
    background:linear-gradient(180deg,#0f1d31,#0a1322);border:1px solid rgba(120,160,210,.22);border-top:2px solid var(--gold);
    border-radius:20px;padding:16px 16px 18px;transform:translateY(118%);transition:transform .32s cubic-bezier(.2,.8,.25,1);
    box-shadow:0 -20px 60px rgba(0,0,0,.6),0 0 40px rgba(47,111,214,.12)}
  .drawer.show{transform:translateY(0)}
  .dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .dhead h2{font-family:'Cinzel';font-weight:600;font-size:17px;margin:0;color:var(--gold-bright)}
  .tier{font-family:'Cinzel';font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(233,189,76,.4);border-radius:20px;padding:2px 9px;margin-top:5px;display:inline-block}
  .dclose{background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
  .meta{font-size:12px;color:var(--mut);margin:9px 0 13px;line-height:1.55}
  .meta b{color:var(--ice);font-weight:500}

  .inputs{display:flex;flex-wrap:wrap;gap:8px}
  .inputs:not(:empty){margin-bottom:13px}
  .field{flex:1;min-width:120px;background:#0b1626;border:1px solid rgba(120,160,210,.16);border-radius:11px;padding:8px 10px}
  .field label{display:block;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:5px;font-family:'Cinzel'}
  .stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stepper button{width:28px;height:28px;border-radius:7px;border:1px solid rgba(120,160,210,.25);background:#13233b;color:var(--ice);font-size:16px;line-height:1;cursor:pointer}
  .stepper button:hover{background:#1a3050}
  .stepper b{font-family:'Cinzel';font-size:18px;min-width:22px;text-align:center;color:var(--ice)}

  .fire{width:100%;font-family:'Cinzel';font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#1a1206;
    background:linear-gradient(180deg,#f7da86,#e0a92f);border:none;border-radius:12px;padding:13px;cursor:pointer;
    box-shadow:0 6px 20px rgba(224,169,47,.3);transition:.12s}
  .fire:hover{filter:brightness(1.07)}.fire:active{transform:translateY(1px)}

  .result{margin-top:13px;border-top:1px solid rgba(120,160,210,.16);padding-top:12px;display:none}
  .result.show{display:block;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(120,160,210,.12)}
  .rrow:last-child{border-bottom:none}
  .rname{font-size:12.5px;color:var(--ink)}
  .rname small{display:block;color:var(--mut);font-size:10.5px;font-family:'Spectral'}
  .dice{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .die{min-width:20px;height:20px;padding:0 3px;border-radius:5px;background:#13233b;border:1px solid rgba(120,160,210,.25);font-family:'Cinzel';font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ice)}
  .die.sh{border-color:rgba(91,155,255,.55);color:var(--sap-bright)}
  .die.th{border-color:rgba(170,140,255,.55);color:#b9a3ff}
  .die.he{border-color:rgba(127,224,176,.5);color:#7fe0b0}
  .rtot{font-family:'Cinzel';font-size:15px;color:var(--gold-bright);min-width:34px;text-align:right}
  .grand{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;padding-top:8px}
  .grand span{font-family:'Cinzel';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
  .grand b{font-family:'Cinzel Decorative';font-size:26px;color:var(--gold-bright);text-shadow:0 0 16px rgba(233,189,76,.4)}
  .heal{color:#7fe0b0!important}

  @keyframes flick{0%{opacity:0}8%{opacity:1}22%{opacity:.25}38%{opacity:1}65%{opacity:.5}100%{opacity:0}}
  .bolt{animation:flick .52s linear forwards}
  @keyframes ringexp{0%{transform:scale(.3);opacity:.85}100%{transform:scale(7);opacity:0}}
  .ring{animation:ringexp .62s ease-out forwards}
</style>
</head>
<body>
  <div class="sky"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="ambient"></div>
  <div class="ambient" id="fireFlash" style="animation:none"></div>

  <div class="device">
    <div class="notch"></div>
    <div class="hdr">
      <div class="who"><h1>Mordewin's Sapphire</h1><p>Lvl 10 Tempest Cleric</p></div>
      <div class="aurum"><span class="pip"></span>7<small>Aurum</small></div>
    </div>

    <div class="stage" id="stage">
      <svg class="wires" id="wires" viewBox="0 0 412 360" preserveAspectRatio="none"></svg>
      <svg class="fx" id="fx" viewBox="0 0 412 360" preserveAspectRatio="none"></svg>

           activation choreography animate around/with it. The .sapphire transforms/filters
           (breathe, charge, shake, drop-shadow glow) apply to the <img> unchanged.

<script>
const SVGNS='http://www.w3.org/2000/svg';
const D=(n,s)=>Array.from({length:n},()=>1+Math.floor(Math.random()*s));
const sum=a=>a.reduce((x,y)=>x+y,0);

/* polar helper — still used by the idle ambient-arc generator below.
   (The gem itself is now the raster <img>, so the old SVG builders were removed.) */
function P(cx,cy,ang,r){const a=ang*Math.PI/180;return [cx+r*Math.sin(a), cy-r*Math.cos(a)];}

/* ---------- power data (Mordewin's real unlocked state) ---------- */
const POWERS={
  tornado:{
    name:"Storm Tornado", tier:"Superior · III", fire:"Unleash the funnel",
    meta:"Usable at <b>≤75% HP</b> · self-heal <b>4d8</b>. Suction: STR save vs <b>DC 21</b>. Roll once each turn it churns.",
    inputs:[{id:"pulled",label:"Caught in the funnel",val:2,min:0,max:4}],
    roll(v){
      const out=[];
      const h=D(4,8); out.push({n:"Self-heal",d:"4d8 (raw)",rolls:h,cls:"he",tot:sum(h),heal:true});
      const c=D(4,6); out.push({n:"Contact",d:"4d6 shock",rolls:c,cls:"sh",tot:sum(c)});
      if(v.pulled>0){let r=[];for(let i=0;i<v.pulled;i++)r.push(...D(1,6));
        out.push({n:"Funnel tick",d:`1d6 × ${v.pulled} caught · this turn`,rolls:r,cls:"",tot:sum(r)});}
      return out;
    }
  },
  thunder:{
    name:"Mordewin's Thunder Step", tier:"Superior · III", fire:"Step through thunder",
    meta:"Spends a <b>1st-level slot</b> · 3 Spiritual Weapons. Teleport blast — halve the thunder on a CON save.",
    inputs:[],
    roll(){
      const o=D(2,6),l=D(3,6);
      return [
        {n:"Origin blast",d:"2d6 thunder · CON ½",rolls:o,cls:"th",tot:sum(o)},
        {n:"Teleport line",d:"3d6 shock",rolls:l,cls:"sh",tot:sum(l)},
      ];
    }
  },
  coral:{
    name:"Static Coral", tier:"Base · I", fire:"Raise the coral",
    meta:"Spends a <b>2nd-level slot</b> · 1 formation. Allies within 10ft: <b>+1d4 Shock</b> on melee. Your Shock spells in the field gain <b>+1 die</b>.",
    inputs:[{id:"hits",label:"Empowered ally hits",val:1,min:0,max:8}],
    roll(v){
      const out=[];
      if(v.hits>0){let r=[];for(let i=0;i<v.hits;i++)r.push(...D(1,4));out.push({n:"Empowered melee",d:`+1d4 shock × ${v.hits}`,rolls:r,cls:"sh",tot:sum(r)});}
      out.push({n:"Field bonus",d:"reminder · +1 die to your Shock spells",rolls:[],cls:"",tot:null});
      return out;
    }
  }
};

const NODES=[
  {key:"tornado", x:50, y:7,  active:true,  tier:3, icon:"ti-tornado",     nm:"Storm Tornado"},
  {key:"thunder", x:10, y:35, active:true,  tier:3, icon:"ti-bolt",        nm:"Thunder Step"},
  {key:"coral",   x:90, y:35, active:true,  tier:1, icon:"ti-windmill",    nm:"Static Coral"},
  {key:"bull",    x:14, y:74, active:false, tier:2, icon:"ti-barbell",     nm:"Bull's Strength", passive:true},
  {key:"born",    x:86, y:74, active:false, tier:3, icon:"ti-shield-bolt", nm:"Storm Born",      passive:true},
  {key:"owl",     x:50, y:93, active:false, tier:0, icon:"ti-feather",     nm:"Owl's Wisdom",    locked:true},
];

const SW=412, SH=360, CX=206, CY=180;
const stage=document.getElementById('stage'), wires=document.getElementById('wires'), fx=document.getElementById('fx');
NODES.forEach(n=>{
  const el=document.createElement('div');
  el.className='node'+(n.passive?' passive':'')+(n.locked?' locked':'');
  el.style.left=`calc(${n.x}% - 42px)`; el.style.top=`calc(${n.y}% - 36px)`;
  let pips='';for(let i=1;i<=4;i++)pips+=`<div class="pip2 ${n.passive?'passive':''} ${i<=n.tier?'on':''}"></div>`;
  el.innerHTML=`<div class="disc"><i class="ti ${n.icon}"></i></div><div class="nm">${n.nm}</div><div class="pips">${pips}</div>`;
  if(n.active) el.onclick=()=>openPower(n.key);
  stage.appendChild(el);
  if(!n.locked){
    const nx=SW*n.x/100, ny=SH*n.y/100;
    const mx=(nx+CX)/2+(Math.random()*20-10), my=(ny+CY)/2+(Math.random()*16-8);
    const line=document.createElementNS(SVGNS,'path');
    line.setAttribute('d',`M${nx} ${ny} Q${mx} ${my} ${CX} ${CY}`);
    line.setAttribute('fill','none');
    line.setAttribute('stroke', n.active?'rgba(233,189,76,.32)':'rgba(91,155,255,.26)');
    line.setAttribute('stroke-width','1.2'); line.dataset.key=n.key;
    wires.appendChild(line);
  }
});
const ti=document.createElement('link');ti.rel='stylesheet';ti.href='https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css';document.head.appendChild(ti);

let cur=null;
function openPower(key){
  cur=key;const p=POWERS[key];
  document.getElementById('dTitle').textContent=p.name;
  document.getElementById('dTier').textContent=p.tier;
  document.getElementById('dMeta').innerHTML=p.meta;
  document.getElementById('dFire').textContent=p.fire;
  const wrap=document.getElementById('dInputs');wrap.innerHTML='';p._v={};
  p.inputs.forEach(f=>{p._v[f.id]=f.val;
    const div=document.createElement('div');div.className='field';
    div.innerHTML=`<label>${f.label}</label><div class="stepper">
      <button onclick="step('${f.id}',-1)">−</button><b id="v_${f.id}">${f.val}</b><button onclick="step('${f.id}',1)">+</button></div>`;
    wrap.appendChild(div);});
  const r=document.getElementById('dResult');r.className='result';r.innerHTML='';
  pulse();
  document.getElementById('scrim').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function step(id,d){const p=POWERS[cur],f=p.inputs.find(x=>x.id===id);
  p._v[id]=Math.max(f.min,Math.min(f.max,p._v[id]+d));document.getElementById('v_'+id).textContent=p._v[id];}
function closeDrawer(){document.getElementById('scrim').classList.remove('show');document.getElementById('drawer').classList.remove('show');}

function fire(){
  const p=POWERS[cur],res=p.roll(p._v);
  dramatize(cur);
  const box=document.getElementById('dResult');box.innerHTML='';
  let grand=0,heal=0;
  res.forEach(r=>{
    if(r.heal)heal+=r.tot;else if(r.tot!==null)grand+=r.tot;
    const dice=r.rolls.map(x=>`<span class="die ${r.cls}">${x}</span>`).join('');
    box.innerHTML+=`<div class="rrow"><div class="rname">${r.n}<small>${r.d}</small></div>
      <div class="dice">${dice}${r.tot!==null?`<span class="rtot ${r.heal?'heal':''}">${r.heal?'+':''}${r.tot}</span>`:'<span class="rtot" style="font-size:11px;color:var(--mut)">noted</span>'}</div></div>`;
  });
  box.innerHTML+=`<div class="grand"><span>Total damage</span><b>${grand}</b></div>`;
  if(heal>0)box.innerHTML+=`<div class="grand" style="margin-top:2px;padding-top:0"><span>Healed</span><b class="heal" style="font-size:20px">+${heal}</b></div>`;
  box.classList.add('show');
}

/* ---------- the drama ---------- */
function boltPts(x1,y1,x2,y2,seg,jit){
  const pts=[[x1,y1]];const nx=-(y2-y1),ny=(x2-x1),len=Math.hypot(nx,ny)||1;
  for(let i=1;i<seg;i++){const t=i/seg,mx=x1+(x2-x1)*t,my=y1+(y2-y1)*t,off=(Math.random()*2-1)*jit;
    pts.push([mx+nx/len*off,my+ny/len*off]);}
  pts.push([x2,y2]);return pts;
}
function drawBolt(x1,y1,x2,y2){
  const pts=boltPts(x1,y1,x2,y2,7,16),d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const glow=document.createElementNS(SVGNS,'path');glow.setAttribute('d',d);glow.setAttribute('fill','none');
  glow.setAttribute('stroke','rgba(120,180,255,.55)');glow.setAttribute('stroke-width','7');glow.setAttribute('stroke-linecap','round');glow.setAttribute('class','bolt');
  const core=document.createElementNS(SVGNS,'path');core.setAttribute('d',d);core.setAttribute('fill','none');
  core.setAttribute('stroke','#eaf6ff');core.setAttribute('stroke-width','2');core.setAttribute('stroke-linecap','round');core.setAttribute('class','bolt');
  fx.appendChild(glow);fx.appendChild(core);
  setTimeout(()=>{glow.remove();core.remove();},540);
}
function dramatize(key){
  const s=document.getElementById('sapphire');s.classList.remove('fire');void s.offsetWidth;s.classList.add('fire');
  setTimeout(()=>s.classList.remove('fire'),680);
  fireFlash();
  const ring=document.createElementNS(SVGNS,'circle');
  ring.setAttribute('cx',CX);ring.setAttribute('cy',CY);ring.setAttribute('r',16);ring.setAttribute('fill','none');
  ring.setAttribute('stroke','#bfe3ff');ring.setAttribute('stroke-width','3');ring.setAttribute('class','ring');
  ring.style.transformOrigin=CX+'px '+CY+'px';fx.appendChild(ring);setTimeout(()=>ring.remove(),660);
  const n=NODES.find(x=>x.key===key),nx=SW*n.x/100,ny=SH*n.y/100;
  drawBolt(nx,ny,CX,CY);
  wires.querySelectorAll('path').forEach(l=>{if(l.dataset.key===key){
    l.setAttribute('stroke','rgba(190,225,255,.95)');l.setAttribute('stroke-width','2.6');
    setTimeout(()=>{l.setAttribute('stroke','rgba(233,189,76,.32)');l.setAttribute('stroke-width','1.2');},620);}});
}
function pulse(){const s=document.getElementById('sapphire');s.classList.remove('fire');void s.offsetWidth;s.classList.add('fire');setTimeout(()=>s.classList.remove('fire'),680);}
function fireFlash(){const f=document.getElementById('fireFlash');f.style.transition='none';f.style.opacity='.62';void f.offsetWidth;f.style.transition='opacity .5s ease';f.style.opacity='0';}

/* faint ambient arcs near the gem */
setInterval(()=>{
  const a=Math.random()*360,b=a+90+Math.random()*120;
  const p1=P(CX,CY,a,52),p2=P(CX,CY,b,52);
  const pts=boltPts(p1[0],p1[1],p2[0],p2[1],5,9),d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  const arc=document.createElementNS(SVGNS,'path');arc.setAttribute('d',d);arc.setAttribute('fill','none');
  arc.setAttribute('stroke','rgba(150,200,255,.5)');arc.setAttribute('stroke-width','1.4');arc.setAttribute('stroke-linecap','round');arc.setAttribute('class','bolt');
  fx.appendChild(arc);setTimeout(()=>arc.remove(),540);
},4200);
</script>
